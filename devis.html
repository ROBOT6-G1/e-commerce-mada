<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demande de Devis | Apex Vision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased">

  <header class="fixed top-0 left-0 right-0 z-50 glass-header border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-cyan-500/20">
          A
        </div>
        <span class="font-bold text-xl tracking-tight text-white">Apex<span class="text-cyan-400">Vision</span></span>
      </a>
      <a href="index.html" class="text-slate-400 hover:text-white text-sm font-medium"><i class="fa-solid fa-arrow-left mr-2"></i> Retour Accueil</a>
    </div>
  </header>

  <section class="pt-36 pb-20 max-w-3xl mx-auto px-6">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 md:p-12 shadow-2xl space-y-8">
      <div>
        <h1 class="text-3xl font-extrabold text-white mb-2">Demande de Devis Gratuit</h1>
        <p class="text-slate-400 text-sm">Remplissez ce formulaire et recevez un chiffrage personnalisé sous 24 à 48h.</p>
      </div>
      <form id="devis-form" class="space-y-6">
        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Nom / Entreprise</label>
            <input type="text" id="d-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:border-cyan-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Téléphone / WhatsApp</label>
            <input type="tel" id="d-phone" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:border-cyan-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Service Requis</label>
          <select id="d-service" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:border-cyan-500 focus:outline-none">
            <option>Transformation Digitale & Cloud</option>
            <option>Conseil en Stratégie & Audit</option>
            <option>Développement Web & Applications</option>
            <option>Cyber-Sécurité & Conformité</option>
            <option>Autre / Projet spécifique</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Budget Estimé (MGA)</label>
          <input type="text" id="d-budget" placeholder="Ex: 2 000 000 Ar - 5 000 000 Ar" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:border-cyan-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Détails de votre projet</label>
          <textarea id="d-details" rows="4" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:border-cyan-500 focus:outline-none"></textarea>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-xl shadow-cyan-500/20 transition-all">
          Soumettre la demande de devis
        </button>
        <div id="devis-success" class="hidden text-emerald-400 text-center font-semibold pt-2">Demande transmise avec succès ! Notre équipe vous recontacte rapidement.</div>
      </form>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
